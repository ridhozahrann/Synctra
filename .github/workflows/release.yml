name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests & build Release APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Align & sign Release APK
        id: sign
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          KEYSTORE="$RUNNER_TEMP/synctra-release.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass synctra-ci-pass \
            -keypass synctra-ci-pass \
            -alias synctra \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Synctra, OU=Mobile, O=Synctra, L=Jakarta, ST=DKI, C=ID"

          ALIGNED="$RUNNER_TEMP/Synctra-${TAG_NAME}-aligned.apk"
          SIGNED="$RUNNER_TEMP/Synctra-${TAG_NAME}-universal.apk"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias synctra \
            --ks-pass pass:synctra-ci-pass \
            --key-pass pass:synctra-ci-pass \
            --out "$SIGNED" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --print-certs "$SIGNED"
          ls -lh "$SIGNED"
          echo "apk_path=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.sign.outputs.tag_name }}
          APK_PATH: ${{ steps.sign.outputs.apk_path }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$APK_PATH" \
              --title "Synctra $TAG_NAME" \
              --notes "## Synctra $TAG_NAME

          Offline Android subtitle sync checker (~7 MB universal APK).

          ### What's included
          - Multi-audio track selector (e.g. pick English or Hindi track for both analysis and 10-second audio preview)
          - Redesigned matte dark UI with monospace timecode readouts and segmented fine-tune controls
          - Automatic subtitle cleanup (ads, URLs, translator credits, SDH cues)
          - Audio-only multi-point sampling with Media3 + FFmpeg audio decoder (AAC, MP3, Opus, FLAC, AC-3, E-AC-3, DTS, TrueHD, ALAC)
          - Progressive drift / FPS mismatch detection

          ### Install
          Download \`Synctra-${TAG_NAME}-universal.apk\` below and install on Android 7.0+ (API 24+)."
          fi
