name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests & build Release APKs (arm64-v8a + universal)
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease -PabiSplits=true

      - name: Align & sign Release APKs
        id: sign
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          KEYSTORE="$RUNNER_TEMP/synctra-release.jks"

          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Using persistent signing keystore from repository secrets."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            KS_PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEY_ALIAS"
            K_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "No signing secret configured; generating ephemeral release key."
            KS_PASS="synctra-ci-pass"
            ALIAS="synctra"
            K_PASS="synctra-ci-pass"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass "$KS_PASS" \
              -keypass "$K_PASS" \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Synctra, OU=Mobile, O=Synctra, L=Jakarta, ST=DKI, C=ID"
          fi

          OUT_DIR="$RUNNER_TEMP/signed"
          mkdir -p "$OUT_DIR"

          sign_apk() {
            local IN_APK="$1"
            local OUT_NAME="$2"
            local ALIGNED="$RUNNER_TEMP/aligned-${OUT_NAME}"
            local SIGNED="$OUT_DIR/${OUT_NAME}"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$IN_APK" "$ALIGNED"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$K_PASS" \
              --out "$SIGNED" \
              "$ALIGNED"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$SIGNED"
          }

          sign_apk "app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk" "Synctra-${TAG_NAME}-arm64-v8a.apk"
          sign_apk "app/build/outputs/apk/release/app-universal-release-unsigned.apk" "Synctra-${TAG_NAME}-universal.apk"

          ls -lh "$OUT_DIR"
          echo "arm64_apk=$OUT_DIR/Synctra-${TAG_NAME}-arm64-v8a.apk" >> "$GITHUB_OUTPUT"
          echo "universal_apk=$OUT_DIR/Synctra-${TAG_NAME}-universal.apk" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.sign.outputs.tag_name }}
          ARM64_APK: ${{ steps.sign.outputs.arm64_apk }}
          UNIVERSAL_APK: ${{ steps.sign.outputs.universal_apk }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$ARM64_APK" "$UNIVERSAL_APK" --clobber
          else
            gh release create "$TAG_NAME" "$ARM64_APK" "$UNIVERSAL_APK" \
              --title "Synctra $TAG_NAME" \
              --notes "## Synctra $TAG_NAME

          Offline Android subtitle sync checker.

          ### Downloads
          - **\`Synctra-${TAG_NAME}-arm64-v8a.apk\`** (~3 MB) — recommended for almost all modern 64-bit Android phones.
          - **\`Synctra-${TAG_NAME}-universal.apk\`** (~7 MB) — works on all Android ABIs (64-bit & 32-bit ARM, x86).

          ### What's new in $TAG_NAME
          - Fixed 10-second Audio Check getting stuck on "Loading audio..." when replaying an already-buffered clip
          - Made Cancel stop background audio extraction/decoding immediately
          - Preserved pending \`.srt\` export options across screen rotation / Activity recreation while the Android file picker is open
          - Auto-pause Audio Check preview when leaving the app, and hardened SRT/VTT parsing for files missing blank lines between cues"
          fi
