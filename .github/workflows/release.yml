name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests & build Release APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease

      - name: Align & sign Release APK
        id: sign
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n 1)
          KEYSTORE="$RUNNER_TEMP/synctra-release.jks"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass synctra-ci-pass \
            -keypass synctra-ci-pass \
            -alias synctra \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Synctra, OU=Mobile, O=Synctra, L=Jakarta, ST=DKI, C=ID"

          ALIGNED="$RUNNER_TEMP/Synctra-${TAG_NAME}-aligned.apk"
          SIGNED="$RUNNER_TEMP/Synctra-${TAG_NAME}-universal.apk"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias synctra \
            --ks-pass pass:synctra-ci-pass \
            --key-pass pass:synctra-ci-pass \
            --out "$SIGNED" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --print-certs "$SIGNED"
          ls -lh "$SIGNED"
          echo "apk_path=$SIGNED" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.sign.outputs.tag_name }}
          APK_PATH: ${{ steps.sign.outputs.apk_path }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$APK_PATH" \
              --title "Synctra $TAG_NAME" \
              --notes "## Synctra $TAG_NAME — Android Subtitle Sync Checker

          Aplikasi Android ringan (100% offline) untuk mengecek selisih detik (*offset*) antara subtitle dan film tanpa tebak-tebakan manual di pemutar video.

          ### Fitur Utama
          - **Audio-Only Multi-Point Sampling:** Analisis 3 titik padat dialog di tengah film (~20%, ~50%, ~75%) tanpa decode video.
          - **Filter Anti-Iklan & SDH Otomatis:** Menyaring iklan situs, URL, kredit penerjemah (Indonesia & Inggris), serta teks non-dialog (\`[musik]\`, \`♪\`).
          - **Dukungan Codec Audio Luas (Media3 + FFmpeg Audio-Only):** Mendukung \`.mp4\`, \`.mkv\`, \`.avi\`, \`.webm\` dengan audio AAC, MP3, Opus, Vorbis, FLAC, **AC-3**, **E-AC-3**, **DTS**, **TrueHD**, dan ALAC.
          - **Deteksi Drift / Beda FPS:** Memberi peringatan jika offset bergeser antara awal–tengah–akhir film (misal 23.976 fps vs 25 fps).
          - **Test Dengar 10 Detik:** Preview audio-only tersinkronisasi dengan teks subtitle real-time + tombol geser halus (\`±0.1s\` / \`±0.5s\`).

          ### Cara Instal di Android
          1. Unduh file **\`Synctra-${TAG_NAME}-universal.apk\`** di bawah ini.
          2. Buka file APK dari File Manager / browser dan izinkan *Install unknown apps* jika diminta.
          3. Pilih file film + file subtitle (\`.srt\`, \`.ass\`/\`.ssa\`, \`.vtt\`) → tekan **Cek Sinkronisasi** → salin angka offset ke VLC / MX Player / Nova Video Player!"
          fi
