name: Feature request
description: Suggest a practical improvement for Synctra
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Explain your use case briefly.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested solution
      description: How should it work while keeping the app lightweight and offline?
    validations:
      required: false
